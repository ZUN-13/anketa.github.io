<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анкетирование Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
    color: #1f2937;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 16px rgba(79,70,229,0.3);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
  #stats { font-size: 14px; opacity: 0.95; }
  .container { max-width: 1240px; margin: 0 auto; padding: 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 6px 24px rgba(15,23,42,0.08);
    margin-bottom: 20px;
    border: 1px solid #eef2f7;
  }
  .card h2 { margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  input, select, button, textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    outline: none;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  button {
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: #fff;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-weight: 500;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.35); }
  button.secondary { background: #64748b; }
  button.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .row input[type="text"] { flex: 1; min-width: 140px; }
  .question-block {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #f8fafc;
  }
  .question-block .row { margin-bottom: 8px; }
  .option-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .option-row input { flex: 1; }
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #eef2f7;
    gap: 10px;
  }
  .list-item:last-child { border-bottom: none; }
  .badge {
    background: #e0e7ff;
    color: #3730a3;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { background: #e2e8f0; color: #1f2937; }
  .tabs button.active { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
  .muted { color: #64748b; font-size: 13px; }
  .chart-box { position: relative; height: 340px; }
  .survey-select { min-width: 220px; }
  .answer-form label { display: block; margin: 5px 0; font-size: 14px; cursor: pointer; }
  .result-summary { font-size: 14px; margin-bottom: 12px; }
  .qtype-badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 8px;
    background: #ede9fe;
    color: #6d28d9;
    margin-left: 6px;
    vertical-align: middle;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #cbd5e1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .avatar-sm { width: 30px; height: 30px; }
  .bot-row { display: flex; align-items: center; gap: 10px; }
  .chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #fef3c7;
    color: #92400e;
  }
  .chip.emotion { background: #fee2e2; color: #991b1b; }
  .chip.age { background: #dbeafe; color: #1e40af; }
  .tab-hidden { display: none; }
  #toggleSecret { background: transparent; color: #94a3b8; font-size: 18px; padding: 4px 10px; }
  #toggleSecret:hover { color: #f8fafc; box-shadow: none; transform: none; }
</style>
</head>
<body>
<header>
  <h1>📊 Система анкетирования Pro</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="stats"></span>
    <button id="toggleSecret" title="Служебные панели">⋮</button>
  </div>
</header>
<div class="container">
  <div class="tabs" id="mainTabs">
    <button data-tab="surveys" class="active">Анкеты</button>
    <button data-tab="bots" class="tab-hidden" id="tabBotBtn">Боты</button>
    <button data-tab="pass" class="tab-hidden" id="tabPassBtn">Пройти анкету</button>
    <button data-tab="results" class="tab-hidden" id="tabResultsBtn">Результаты</button>
  </div>

  <div id="tab-surveys">
    <div class="grid">
      <div class="card">
        <h2>Создать анкету</h2>
        <div class="row">
          <input type="text" id="surveyTitle" placeholder="Название анкеты">
        </div>
        <div id="questionsEditor"></div>
        <div class="row">
          <button onclick="addQuestion()">+ Добавить вопрос</button>
          <button onclick="saveSurvey()">Сохранить анкету</button>
        </div>
        <p class="muted">Типы вопросов: открытый, закрытый (один/несколько), полузакрытый (варианты + свой).</p>
      </div>
      <div class="card">
        <h2>Список анкет <span class="badge" id="surveyCount">0</span></h2>
        <div id="surveyList"></div>
      </div>
    </div>
  </div>

  <div id="tab-bots" class="tab-hidden">
    <div class="grid">
      <div class="card">
        <h2>Создать бота-респондента</h2>
        <div class="row">
          <input type="text" id="botName" placeholder="Имя бота">
        </div>
        <div class="row">
          <select id="botAge">
            <option value="18">18–25 лет</option>
            <option value="30">26–35 лет</option>
            <option value="45">36–50 лет</option>
            <option value="60">51–65 лет</option>
            <option value="70">65+ лет</option>
          </select>
          <select id="botEmotion">
            <option value="радость">радость</option>
            <option value="грусть">грусть</option>
            <option value="гнев">гнев</option>
            <option value="спокойствие">спокойствие</option>
            <option value="восторг">восторг</option>
            <option value="скепсис">скепсис</option>
            <option value="тревога">тревога</option>
            <option value="ирония">ирония</option>
          </select>
        </div>
        <div class="row" style="margin-top:10px">
          <button onclick="createBot()">Создать</button>
        </div>
        <div class="row">
          <button onclick="runAllBots()">Запустить всех ботов по всем анкетам</button>
        </div>
        <p class="muted">Боты генерируют ответы «как люди» с учётом возраста и эмоции.</p>
      </div>
      <div class="card">
        <h2>Список ботов <span class="badge" id="botCount">0</span></h2>
        <div id="botList"></div>
      </div>
    </div>
  </div>

  <div id="tab-pass" class="tab-hidden">
    <div class="card">
      <h2>Пройти анкету</h2>
      <div class="row">
        <select id="passSurveySelect" class="survey-select" onchange="renderPassForm()"></select>
        <select id="passBotSelect" onchange="renderPassForm()"></select>
      </div>
      <div id="passForm" class="answer-form"></div>
    </div>
  </div>

  <div id="tab-results" class="tab-hidden">
    <div class="card">
      <h2>Диаграмма результатов</h2>
      <div class="row">
        <select id="resultSurveySelect" class="survey-select" onchange="renderResults()"></select>
        <select id="resultQuestionSelect" onchange="renderResults()"></select>
        <select id="chartType" onchange="renderResults()">
          <option value="bar">Столбчатая</option>
          <option value="horizontalBar">Горизонтальная</option>
          <option value="doughnut">Кольцевая</option>
          <option value="pie">Круговая</option>
          <option value="polarArea">Полярная</option>
          <option value="radar">Радар</option>
        </select>
      </div>
      <div id="resultSummary" class="result-summary"></div>
      <div class="chart-box"><canvas id="resultChart"></canvas></div>
    </div>
    <div class="card">
      <h2>Все ответы</h2>
      <div id="allResponses"></div>
    </div>
  </div>
</div>

<script>
const state = {
  surveys: [],
  bots: [],
  responses: [],
  questionCounter: 0,
  chart: null,
  editingOptions: {}
};

const QTYPE_LABEL = {
  open: 'открытый',
  closed: 'закрытый',
  semi: 'полузакрытый'
};

const UNKNOWN_AVATAR = `data:image/svg+xml;utf8,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#cbd5e1"/>
  <circle cx="32" cy="24" r="12" fill="#94a3b8"/>
  <path d="M8 60c0-13 10-22 24-22s24 9 24 22z" fill="#94a3b8"/>
</svg>
`)}`;

function uid() { return Math.random().toString(36).slice(2, 10); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function saveToStorage() {
  try {
    localStorage.setItem('survey_app_v3', JSON.stringify({
      surveys: state.surveys,
      bots: state.bots,
      responses: state.responses
    }));
  } catch (e) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem('survey_app_v3');
    if (raw) {
      const d = JSON.parse(raw);
      state.surveys = d.surveys || [];
      state.bots = d.bots || [];
      state.responses = d.responses || [];
    }
  } catch (e) {}
}

function updateStats() {
  document.getElementById('stats').textContent =
    `Анкет: ${state.surveys.length} | Ботов: ${state.bots.length} | Ответов: ${state.responses.length}`;
  document.getElementById('surveyCount').textContent = state.surveys.length;
  document.getElementById('botCount').textContent = state.bots.length;
}

function addQuestion(preset) {
  const id = 'q_' + (++state.questionCounter);
  if (!preset) {
    state.editingOptions[id] = { text: '', type: 'closed', multi: false, options: ['', ''] };
  } else {
    state.editingOptions[id] = {
      text: preset.text || '',
      type: preset.type || 'closed',
      multi: !!preset.multi,
      options: (preset.options || ['', '']).slice()
    };
  }
  window.__qDraft = window.__qDraft || {};
  window.__qDraft[id] = state.editingOptions[id];
  renderQuestionsEditor();
}

function renderQuestionsEditor() {
  const box = document.getElementById('questionsEditor');
  const draft = window.__qDraft || {};
  const ids = Object.keys(draft);
  box.innerHTML = '';
  ids.forEach((qid, idx) => {
    const q = draft[qid];
    const block = document.createElement('div');
    block.className = 'question-block';
    block.innerHTML = `
      <div class="row">
        <input type="text" placeholder="Вопрос ${idx + 1}" value="${escapeHtml(q.text)}" data-role="qtext">
        <select data-role="qtype">
          <option value="open">Открытый</option>
          <option value="closed">Закрытый</option>
          <option value="semi">Полузакрытый</option>
        </select>
        <label class="muted" data-role="multiwrap"><input type="checkbox" data-role="qmulti"> несколько</label>
        <button class="danger" data-role="delq">✕</button>
      </div>
      <div class="options"></div>
    `;
    const qtext = block.querySelector('[data-role="qtext"]');
    const qtype = block.querySelector('[data-role="qtype"]');
    const qmulti = block.querySelector('[data-role="qmulti"]');
    const multiwrap = block.querySelector('[data-role="multiwrap"]');
    qtext.value = q.text;
    qtype.value = q.type;
    qmulti.checked = q.multi;
    qtext.oninput = () => { q.text = qtext.value; };
    qtype.onchange = () => {
      q.type = qtype.value;
      if (q.type === 'open') { q.multi = false; qmulti.checked = false; }
      renderQuestionsEditor();
    };
    qmulti.onchange = () => { q.multi = qmulti.checked; };
    multiwrap.style.display = q.type === 'closed' ? '' : 'none';
    block.querySelector('[data-role="delq"]').onclick = () => {
      delete draft[qid];
      renderQuestionsEditor();
    };
    const optBox = block.querySelector('.options');
    if (q.type !== 'open') {
      q.options.forEach((o, oi) => {
        const orow = document.createElement('div');
        orow.className = 'option-row';
        orow.innerHTML = `
          <input type="text" placeholder="Вариант ${oi + 1}" value="${escapeHtml(o)}">
          <button class="secondary" data-role="delopt">✕</button>
        `;
        orow.querySelector('input').oninput = (e) => { q.options[oi] = e.target.value; };
        orow.querySelector('[data-role="delopt"]').onclick = () => {
          q.options.splice(oi, 1);
          renderQuestionsEditor();
        };
        optBox.appendChild(orow);
      });
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ вариант';
      addBtn.className = 'secondary';
      addBtn.onclick = () => { q.options.push(''); renderQuestionsEditor(); };
      optBox.appendChild(addBtn);
      if (q.type === 'semi') {
        const hint = document.createElement('p');
        hint.className = 'muted';
        hint.textContent = 'Будет добавлено поле «Свой вариант».';
        optBox.appendChild(hint);
      }
    } else {
      const hint = document.createElement('p');
      hint.className = 'muted';
      hint.textContent = 'Открытый вопрос: респондент вводит ответ вручную.';
      optBox.appendChild(hint);
    }
    box.appendChild(block);
  });
}

function saveSurvey() {
  const title = document.getElementById('surveyTitle').value.trim();
  if (!title) { alert('Введите название анкеты'); return; }
  const draft = window.__qDraft || {};
  const ids = Object.keys(draft);
  if (!ids.length) { alert('Добавьте хотя бы один вопрос'); return; }
  const questions = [];
  for (const qid of ids) {
    const q = draft[qid];
    const text = (q.text || '').trim();
    if (!text) { alert('Заполните текст всех вопросов'); return; }
    let options = [];
    if (q.type !== 'open') {
      options = (q.options || []).map(o => o.trim()).filter(Boolean);
      if (options.length < 2) { alert('У вопроса должно быть минимум 2 варианта: ' + text); return; }
    }
    questions.push({
      id: qid,
      text,
      type: q.type,
      multi: !!q.multi,
      options
    });
  }
  state.surveys.push({ id: uid(), title, questions, createdAt: Date.now() });
  window.__qDraft = {};
  document.getElementById('surveyTitle').value = '';
  renderQuestionsEditor();
  renderSurveyList();
  refreshSelects();
  saveToStorage();
  updateStats();
}

function renderSurveyList() {
  const box = document.getElementById('surveyList');
  if (!state.surveys.length) { box.innerHTML = '<p class="muted">Нет анкет</p>'; return; }
  box.innerHTML = '';
  state.surveys.forEach(s => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div>
        <strong>${escapeHtml(s.title)}</strong>
        <div class="muted">Вопросов: ${s.questions.length} | Ответов: ${state.responses.filter(r => r.surveyId === s.id).length}</div>
      </div>
      <button class="danger" data-id="${s.id}">Удалить</button>
    `;
    div.querySelector('button').onclick = () => deleteSurvey(s.id);
    box.appendChild(div);
  });
}

function deleteSurvey(id) {
  if (!confirm('Удалить анкету и все её ответы?')) return;
  state.surveys = state.surveys.filter(s => s.id !== id);
  state.responses = state.responses.filter(r => r.surveyId !== id);
  renderSurveyList();
  refreshSelects();
  saveToStorage();
  updateStats();
}

function createBot() {
  const name = document.getElementById('botName').value.trim();
  if (!name) { alert('Введите имя бота'); return; }
  const age = parseInt(document.getElementById('botAge').value, 10);
  const emotion = document.getElementById('botEmotion').value;
  state.bots.push({ id: uid(), name, age, emotion });
  document.getElementById('botName').value = '';
  renderBotList();
  refreshSelects();
  saveToStorage();
  updateStats();
}

function renderBotList() {
  const box = document.getElementById('botList');
  if (!state.bots.length) { box.innerHTML = '<p class="muted">Нет ботов</p>'; return; }
  box.innerHTML = '';
  state.bots.forEach(b => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      <div class="bot-row">
        <img src="${UNKNOWN_AVATAR}" class="avatar" alt="">
        <div>
          <strong>${escapeHtml(b.name)}</strong>
          <div class="muted">
            <span class="chip age">${b.age} лет</span>
            <span class="chip emotion">${escapeHtml(b.emotion)}</span>
          </div>
        </div>
      </div>
      <button class="danger" data-id="${b.id}">Удалить</button>
    `;
    div.querySelector('button').onclick = () => deleteBot(b.id);
    box.appendChild(div);
  });
}

function deleteBot(id) {
  state.bots = state.bots.filter(b => b.id !== id);
  state.responses = state.responses.filter(r => r.botId !== id);
  renderBotList();
  refreshSelects();
  saveToStorage();
  updateStats();
}

function ageGroup(age) {
  if (age <= 25) return 'молодой';
  if (age <= 35) return 'взрослый';
  if (age <= 50) return 'средних лет';
  return 'пожилой';
}

function openAnswerText(bot) {
  const byAge = {
    'молодой': ['Короче, всё норм', 'Мне зашло, реально', 'Ну такое, если честно', 'Топ, рекомендую', 'Не особо, если честно'],
    'взрослый': ['В целом устраивает', 'Есть недочёты, но приемлемо', 'Скорее да, чем нет', 'Нужно доработать', 'Всё достаточно логично'],
    'средних лет': ['Считаю подход разумным', 'Опыт подсказывает, что есть нюансы', 'Всё в рамках ожидаемого', 'Хотелось бы больше конкретики', 'Приемлемо для текущих условий'],
    'пожилой': ['Раньше было проще', 'Не всё понятно, но ладно', 'Молодёжь разберётся', 'Слишком много нового', 'В моё время было иначе']
  };
  const byEmotion = {
    'радость': 'Очень рад(а), что спросили!',
    'грусть': 'Немного грустно от этого.',
    'гнев': 'Меня это раздражает!',
    'спокойствие': 'Спокойно отношусь.',
    'восторг': 'Это просто восторг!',
    'скепсис': 'Сомневаюсь, что это сработает.',
    'тревога': 'Честно, немного тревожно.',
    'ирония': 'Ну конечно, куда без этого.'
  };
  const base = byAge[ageGroup(bot.age)] || byAge['взрослый'];
  const phrase = base[Math.floor(Math.random() * base.length)];
  const emo = byEmotion[bot.emotion] || '';
  return `${phrase}. ${emo}`.trim();
}

function generateAnswers(survey, bot) {
  const answers = {};
  survey.questions.forEach(q => {
    if (q.type === 'open') {
      answers[q.id] = openAnswerText(bot);
    } else if (q.type === 'semi') {
      const useOwn = Math.random() < 0.35;
      if (useOwn) {
        answers[q.id] = openAnswerText(bot);
      } else if (q.multi) {
        const count = 1 + Math.floor(Math.random() * Math.max(1, q.options.length - 1));
        const shuffled = q.options.slice().sort(() => Math.random() - 0.5);
        answers[q.id] = shuffled.slice(0, count);
      } else {
        answers[q.id] = q.options[Math.floor(Math.random() * q.options.length)];
      }
    } else {
      if (q.multi) {
        const count = 1 + Math.floor(Math.random() * Math.max(1, q.options.length - 1));
        const shuffled = q.options.slice().sort(() => Math.random() - 0.5);
        answers[q.id] = shuffled.slice(0, count);
      } else {
        answers[q.id] = q.options[Math.floor(Math.random() * q.options.length)];
      }
    }
  });
  return answers;
}

function runAllBots() {
  if (!state.bots.length) { alert('Сначала создайте ботов'); return; }
  if (!state.surveys.length) { alert('Сначала создайте анкеты'); return; }
  state.bots.forEach(bot => {
    state.surveys.forEach(survey => {
      state.responses.push({
        id: uid(),
        surveyId: survey.id,
        botId: bot.id,
        botName: bot.name,
        answers: generateAnswers(survey, bot),
        createdAt: Date.now()
      });
    });
  });
  saveToStorage();
  updateStats();
  renderSurveyList();
  renderResults();
  alert('Боты прошли все анкеты!');
}

function refreshSelects() {
  const passSurvey = document.getElementById('passSurveySelect');
  const passBot = document.getElementById('passBotSelect');
  const resSurvey = document.getElementById('resultSurveySelect');
  passSurvey.innerHTML = state.surveys.map(s => `<option value="${s.id}">${escapeHtml(s.title)}</option>`).join('');
  passBot.innerHTML = state.bots.map(b => `<option value="${b.id}">${escapeHtml(b.name)} (${b.age}, ${b.emotion})</option>`).join('');
  resSurvey.innerHTML = state.surveys.map(s => `<option value="${s.id}">${escapeHtml(s.title)}</option>`).join('');
  renderPassForm();
  renderResults();
}

function renderPassForm() {
  const sId = document.getElementById('passSurveySelect').value;
  const bId = document.getElementById('passBotSelect').value;
  const box = document.getElementById('passForm');
  const survey = state.surveys.find(s => s.id === sId);
  if (!survey) { box.innerHTML = '<p class="muted">Выберите анкету</p>'; return; }
  const bot = state.bots.find(b => b.id === bId);
  if (!bot) { box.innerHTML = '<p class="muted">Выберите бота-респондента</p>'; return; }
  box.innerHTML = '';
  survey.questions.forEach((q, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    let inner = `<div><strong>${idx + 1}. ${escapeHtml(q.text)}</strong>
      <span class="qtype-badge">${QTYPE_LABEL[q.type]}</span></div>`;
    if (q.type === 'open') {
      inner += `<input type="text" data-qid="${q.id}" data-type="open" style="width:100%;margin-top:6px" placeholder="Ваш ответ">`;
    } else if (q.type === 'semi') {
      if (q.multi) {
        q.options.forEach(o => {
          inner += `<label><input type="checkbox" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="semi-multi"> ${escapeHtml(o)}</label>`;
        });
      } else {
        q.options.forEach(o => {
          inner += `<label><input type="radio" name="q_${q.id}" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="semi-single"> ${escapeHtml(o)}</label>`;
        });
      }
      inner += `<input type="text" data-qid="${q.id}" data-type="semi-own" placeholder="Свой вариант" style="width:100%;margin-top:6px">`;
    } else {
      if (q.multi) {
        q.options.forEach(o => {
          inner += `<label><input type="checkbox" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="closed-multi"> ${escapeHtml(o)}</label>`;
        });
      } else {
        q.options.forEach(o => {
          inner += `<label><input type="radio" name="q_${q.id}" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="closed-single"> ${escapeHtml(o)}</label>`;
        });
      }
    }
    block.innerHTML = inner;
    box.appendChild(block);
  });
  const btn = document.createElement('button');
  btn.textContent = 'Отправить ответы';
  btn.onclick = () => submitAnswers(survey, bot);
  box.appendChild(btn);
}

function submitAnswers(survey, bot) {
  const answers = {};
  let ok = true;
  survey.questions.forEach(q => {
    if (q.type === 'open') {
      const el = document.querySelector(`input[data-qid="${q.id}"][data-type="open"]`);
      const v = el ? el.value.trim() : '';
      if (!v) ok = false;
      answers[q.id] = v;
    } else if (q.type === 'semi') {
      const own = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-own"]`);
      const ownVal = own ? own.value.trim() : '';
      if (q.multi) {
        const els = document.querySelectorAll(`input[data-qid="${q.id}"][data-type="semi-multi"]:checked`);
        const arr = Array.from(els).map(e => e.value);
        if (ownVal) arr.push(ownVal);
        if (!arr.length) ok = false;
        answers[q.id] = arr;
      } else {
        const el = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-single"]:checked`);
        answers[q.id] = ownVal || (el ? el.value : '');
        if (!answers[q.id]) ok = false;
      }
    } else {
      if (q.multi) {
        const els = document.querySelectorAll(`input[data-qid="${q.id}"][data-type="closed-multi"]:checked`);
        const arr = Array.from(els).map(e => e.value);
        if (!arr.length) ok = false;
        answers[q.id] = arr;
      } else {
        const el = document.querySelector(`input[data-qid="${q.id}"][data-type="closed-single"]:checked`);
        if (!el) ok = false;
        answers[q.id] = el ? el.value : '';
      }
    }
  });
  if (!ok) { alert('Ответьте на все вопросы'); return; }
  state.responses.push({
    id: uid(),
    surveyId: survey.id,
    botId: bot.id,
    botName: bot.name,
    answers,
    createdAt: Date.now()
  });
  saveToStorage();
  updateStats();
  renderSurveyList();
  alert('Ответы сохранены!');
}

function smartColors(labels, values, type) {
  const basePalettes = [
    ['#6366f1','#818cf8','#a5b4fc','#c7d2fe','#e0e7ff'],
    ['#8b5cf6','#a78bfa','#c4b5fd','#ddd6fe','#ede9fe'],
    ['#ec4899','#f472b6','#f9a8d4','#fbcfe8','#fce7f3'],
    ['#10b981','#34d399','#6ee7b7','#a7f3d0','#d1fae5'],
    ['#f59e0b','#fbbf24','#fcd34d','#fde68a','#fef3c7'],
    ['#06b6d4','#22d3ee','#67e8f9','#a5f3fc','#cffafe']
  ];
  const total = values.reduce((a, b) => a + b, 0) || 1;
  const max = Math.max(...values, 1);
  const colors = labels.map((_, i) => {
    const ratio = (values[i] || 0) / total;
    const intensity = Math.max(0.35, Math.min(1, (values[i] || 0) / max));
    const palette = basePalettes[i % basePalettes.length];
    const idx = Math.min(palette.length - 1, Math.floor((1 - intensity) * (palette.length - 1)));
    return palette[type === 'bar' || type === 'radar' ? Math.min(palette.length - 1, Math.floor(ratio * 4)) : idx];
  });
  return colors;
}

function renderResults() {
  const sId = document.getElementById('resultSurveySelect').value;
  const survey = state.surveys.find(s => s.id === sId);
  const qSelect = document.getElementById('resultQuestionSelect');
  const summary = document.getElementById('resultSummary');
  const allBox = document.getElementById('allResponses');
  if (state.chart) { state.chart.destroy(); state.chart = null; }

  if (!survey) {
    qSelect.innerHTML = '';
    summary.textContent = '';
    allBox.innerHTML = '';
    return;
  }

  qSelect.innerHTML = survey.questions.map(q =>
    `<option value="${q.id}">${escapeHtml(q.text)} (${QTYPE_LABEL[q.type]})</option>`
  ).join('');
  const qId = qSelect.value || survey.questions[0]?.id;
  if (qId) qSelect.value = qId;
  const question = survey.questions.find(q => q.id === qId);

  const responses = state.responses.filter(r => r.surveyId === sId);
  summary.innerHTML = `Всего ответов: <strong>${responses.length}</strong>`;

  allBox.innerHTML = '';
  if (responses.length) {
    responses.slice().reverse().forEach(r => {
      const div = document.createElement('div');
      div.className = 'list-item';
      const date = new Date(r.createdAt).toLocaleString();
      const ansStr = survey.questions.map(q => {
        const a = r.answers[q.id];
        const val = Array.isArray(a) ? a.join(', ') : a;
        return `<div class="muted">${escapeHtml(q.text)}: <strong>${escapeHtml(val || '—')}</strong></div>`;
      }).join('');
      div.innerHTML = `
        <div style="display:flex;gap:10px;align-items:flex-start">
          <img src="${UNKNOWN_AVATAR}" class="avatar avatar-sm" alt="">
          <div>
            <strong>${escapeHtml(r.botName)}</strong> <span class="muted">${date}</span>
            ${ansStr}
          </div>
        </div>`;
      allBox.appendChild(div);
    });
  } else {
    allBox.innerHTML = '<p class="muted">Нет ответов</p>';
  }

  if (!question) return;

  const counts = {};
  responses.forEach(r => {
    const a = r.answers[qId];
    if (Array.isArray(a)) a.forEach(v => counts[v] = (counts[v] || 0) + 1);
    else if (a) counts[a] = (counts[a] || 0) + 1;
  });

  const ctx = document.getElementById('resultChart').getContext('2d');
  let chartType = document.getElementById('chartType').value;

  let labels, values;
  if (question.type === 'open' || question.type === 'semi') {
    const arr = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12);
    labels = arr.map(x => x[0]);
    values = arr.map(x => x[1]);
  } else {
    labels = question.options.slice();
    values = labels.map(l => counts[l] || 0);
  }

  if (!labels.length || values.every(v => v === 0)) {
    summary.innerHTML += '<br><span class="muted">Нет данных для диаграммы</span>';
    return;
  }

  const isCircular = chartType === 'doughnut' || chartType === 'pie' || chartType === 'polarArea';
  const colors = smartColors(labels, values, chartType === 'radar' ? 'bar' : (isCircular ? 'circle' : 'bar'));

  if (chartType === 'horizontalBar') {
    chartType = 'bar';
    const ds = {
      label: 'Количество',
      data: values,
      backgroundColor: colors,
      borderRadius: 8,
      borderSkipped: false,
      barThickness: 'flex',
      maxBarThickness: 42
    };
    state.chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [ds] },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 900, easing: 'easeOutQuart' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(15,23,42,0.92)',
            padding: 12,
            cornerRadius: 10,
            titleFont: { size: 14, weight: '600' },
            bodyFont: { size: 13 },
            callbacks: {
              label: (c) => {
                const t = values.reduce((a, b) => a + b, 0) || 1;
                return ` ${c.parsed.x} (${Math.round(c.parsed.x / t * 100)}%)`;
              }
            }
          }
        },
        scales: {
          x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#eef2f7' } },
          y: { grid: { display: false }, ticks: { font: { size: 12 } } }
        }
      }
    });
    return;
  }

  if (chartType === 'radar') {
    state.chart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels,
        datasets: [{
          label: 'Количество',
          data: values,
          backgroundColor: 'rgba(99,102,241,0.25)',
          borderColor: '#6366f1',
          borderWidth: 2,
          pointBackgroundColor: colors,
          pointBorderColor: '#fff',
          pointRadius: 5,
          pointHoverRadius: 7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 900, easing: 'easeOutQuart' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: 'rgba(15,23,42,0.92)',
            padding: 12,
            cornerRadius: 10
          }
        },
        scales: {
          r: {
            beginAtZero: true,
            ticks: { precision: 0, backdropColor: 'transparent' },
            grid: { color: '#e2e8f0' },
            angleLines: { color: '#e2e8f0' },
            pointLabels: { font: { size: 12 } }
          }
        }
      }
    });
    return;
  }

  state.chart = new Chart(ctx, {
    type: chartType,
    data: {
      labels,
      datasets: [{
        label: 'Количество',
        data: values,
        backgroundColor: colors,
        borderColor: isCircular ? '#fff' : 'transparent',
        borderWidth: isCircular ? 3 : 0,
        borderRadius: isCircular ? 0 : 10,
        borderSkipped: false,
        hoverOffset: isCircular ? 12 : 0,
        hoverBorderColor: isCircular ? '#fff' : 'transparent'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 900, easing: 'easeOutQuart' },
      plugins: {
        legend: {
          display: isCircular,
          position: 'bottom',
          labels: {
            padding: 16,
            font: { size: 13 },
            usePointStyle: true,
            pointStyle: 'circle'
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.92)',
          padding: 12,
          cornerRadius: 10,
          titleFont: { size: 14, weight: '600' },
          bodyFont: { size: 13 },
          callbacks: {
            label: (c) => {
              const t = values.reduce((a, b) => a + b, 0) || 1;
              const v = isCircular ? c.parsed : c.parsed.y;
              return ` ${v} (${Math.round(v / t * 100)}%)`;
            }
          }
        }
      },
      scales: isCircular ? {} : {
        y: {
          beginAtZero: true,
          ticks: { precision: 0, font: { size: 12 } },
          grid: { color: '#eef2f7' }
        },
        x: {
          ticks: { font: { size: 12 } },
          grid: { display: false }
        }
      }
    }
  });
}

let secretOpen = false;
document.getElementById('toggleSecret').onclick = () => {
  secretOpen = !secretOpen;
  ['tabBotBtn','tabPassBtn','tabResultsBtn'].forEach(id => {
    document.getElementById(id).classList.toggle('tab-hidden', !secretOpen);
  });
  if (!secretOpen) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelector('.tabs button[data-tab="surveys"]').classList.add('active');
    ['surveys','bots','pass','results'].forEach(t => {
      document.getElementById('tab-' + t).style.display = t === 'surveys' ? '' : 'none';
    });
    document.getElementById('tab-surveys').classList.remove('tab-hidden');
    ['tab-bots','tab-pass','tab-results'].forEach(id => document.getElementById(id).classList.add('tab-hidden'));
  } else {
    document.getElementById('tab-surveys').classList.remove('tab-hidden');
    ['tab-bots','tab-pass','tab-results'].forEach(id => document.getElementById(id).classList.remove('tab-hidden'));
  }
};

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['surveys','bots','pass','results'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (t === btn.dataset.tab) {
        el.style.display = '';
        el.classList.remove('tab-hidden');
      } else {
        el.style.display = 'none';
      }
    });
    if (btn.dataset.tab === 'results') renderResults();
    if (btn.dataset.tab === 'pass') renderPassForm();
  };
});

loadFromStorage();
addQuestion();
renderQuestionsEditor();
renderSurveyList();
renderBotList();
refreshSelects();
updateStats();
</script>
