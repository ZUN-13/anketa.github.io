<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="api.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%); color: #1f2937; min-height: 100vh; font-size: 15px; }
  header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; box-shadow: 0 4px 16px rgba(79,70,229,0.3); position: relative; }
  header h1 { margin: 0; font-size: 17px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { background: rgba(255,255,255,0.18); padding: 4px 10px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .user-chip .av { width: 22px; height: 22px; border-radius: 50%; background: #cbd5e1; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .user-chip .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .burger { background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .menu { position: absolute; top: 62px; right: 18px; background: #fff; border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,0.18); padding: 6px; min-width: 210px; z-index: 100; display: none; }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; background: transparent; color: #1f2937; border: none; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .menu button:hover { background: #eef2ff; color: #4338ca; }
  .menu .divider { height: 1px; background: #eef2f7; margin: 4px 0; }
  .container { max-width: 1240px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 6px 24px rgba(15,23,42,0.08); margin-bottom: 16px; border: 1px solid #eef2f7; }
  .card h2 { margin-top: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  input, select, button, textarea { font-family: inherit; font-size: 14px; padding: 9px 11px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; background: #fff; }
  button { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; border: none; cursor: pointer; font-weight: 500; transition: transform 0.15s, box-shadow 0.15s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.35); }
  button.secondary { background: #64748b; }
  button.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .row input[type="text"], .row input[type="password"] { flex: 1; min-width: 140px; }
  .question-block { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #f8fafc; }
  .option-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .option-row input { flex: 1; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-bottom: 1px solid #eef2f7; gap: 10px; flex-wrap: wrap; }
  .badge { background: #e0e7ff; color: #3730a3; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.mine { background: #dcfce7; color: #166534; }
  .badge.other { background: #fef3c7; color: #92400e; }
  .muted { color: #64748b; font-size: 12px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bot-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .tab-hidden { display: none; }
  .answer-edit { background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #6366f1; }
  .answer-edit .question-block { background: #fff; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .profile-preview { width: 48px; height: 48px; border-radius: 50%; background: #cbd5e1; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 2px solid #e2e8f0; }
  .profile-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-btn { background: #eef2ff; color: #4338ca; font-size: 13px; padding: 8px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #c7d2fe; display: inline-block; }
  .results-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; padding: 12px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
  .results-toolbar label { font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
  .results-toolbar .field { flex: 1; min-width: 160px; }
  .results-toolbar select { width: 100%; padding: 10px 12px; font-size: 14px; }
  .results-summary-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .summary-card { flex: 1; min-width: 140px; background: linear-gradient(135deg, #eef2ff, #e0e7ff); border-radius: 12px; padding: 12px 16px; border: 1px solid #c7d2fe; }
  .summary-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #6366f1; font-weight: 700; margin-bottom: 4px; }
  .summary-card .value { font-size: 22px; font-weight: 800; color: #312e81; line-height: 1.1; }
  .result-block { border: 1px solid #e2e8f0; border-radius: 14px; margin-bottom: 18px; background: #fff; overflow: hidden; }
  .result-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; flex-wrap: wrap; }
  .result-header h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; word-break: break-word; }
  .result-header .qnum { background: rgba(255,255,255,0.22); width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .result-body { display: grid; grid-template-columns: 1.1fr 1fr; gap: 0; }
  @media (max-width: 760px) { .result-body { grid-template-columns: 1fr; } }
  .chart-wrap { padding: 14px; border-right: 1px solid #eef2f7; }
  @media (max-width: 760px) { .chart-wrap { border-right: none; border-bottom: 1px solid #eef2f7; } }
  .chart-canvas-wrap { position: relative; width: 100%; height: 260px; }
  @media (max-width: 640px) { .chart-canvas-wrap { height: 220px; } }
  .chart-canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
  .answers-wrap { padding: 14px; }
  .answers-list { max-height: 260px; overflow-y: auto; padding-right: 4px; }
  .answer-row { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
  .answer-content { flex: 1; min-width: 0; }
  .answer-content .q { font-size: 11px; color: #64748b; font-weight: 600; }
  .answer-content .a { font-size: 13px; font-weight: 500; word-break: break-word; }
  .bot-select-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #eef2f7; cursor: pointer; }
  .bot-select-item.selected { background: #eef2ff; }
  .bot-check { width: 18px; height: 18px; border-radius: 6px; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #fff; }
  .bot-select-item.selected .bot-check { background: #4f46e5; border-color: #4f46e5; }
  .bot-select-item.selected .bot-check::after { content: '✓'; color: #fff; font-size: 12px; font-weight: 700; }
  .bot-send-bar { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; border-radius: 12px; padding: 14px; margin-top: 12px; }
  .bot-send-bar select { width: 100%; padding: 10px; margin-bottom: 10px; border: none; }
  .bot-send-bar button { background: #fff; color: #4338ca; font-weight: 600; padding: 10px 14px; margin-right: 6px; }
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(135deg, #4f46e5, #7c3aed); }
  .auth-card { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(15,23,42,0.3); }
  .auth-card h1 { margin: 0 0 4px; font-size: 22px; color: #312e81; text-align: center; }
  .auth-card p.sub { margin: 0 0 18px; font-size: 13px; color: #64748b; text-align: center; }
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 16px; background: #f1f5f9; border-radius: 10px; padding: 4px; }
  .auth-tabs button { flex: 1; background: transparent; color: #475569; padding: 8px; border-radius: 8px; font-weight: 600; }
  .auth-tabs button.active { background: #4f46e5; color: #fff; }
  .auth-card input { width: 100%; margin-bottom: 10px; padding: 11px 12px; }
  .auth-card .field-label { font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; display: block; }
  .auth-card .submit-btn { width: 100%; padding: 12px; font-size: 15px; }
  .auth-error { background: #fee2e2; color: #991b1b; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; display: none; }
  .auth-error.show { display: block; }
  .device-badge { font-size: 11px; color: #64748b; margin-top: 8px; text-align: center; }
  @media (max-width: 640px) {
    .container { padding: 10px; }
    .card { padding: 12px; }
    header h1 { font-size: 15px; }
    input, select, button, textarea { font-size: 16px; }
    .menu { right: 10px; top: 58px; }
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <h1>Админ-панель</h1>
    <p class="sub">Единая база данных</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuth('login')">Вход</button>
      <button id="tabRegister" onclick="switchAuth('register')">Регистрация</button>
    </div>
    <div id="authError" class="auth-error"></div>
    <div id="loginForm">
      <label class="field-label">Имя пользователя</label>
      <input type="text" id="loginName" placeholder="Ваше имя" autocomplete="username">
      <label class="field-label">Пароль</label>
      <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
      <button class="submit-btn" onclick="doLogin()">Войти</button>
    </div>
    <div id="registerForm" style="display:none">
      <label class="field-label">Имя пользователя</label>
      <input type="text" id="regName" placeholder="Ваше имя" autocomplete="username">
      <label class="field-label">Пароль</label>
      <input type="password" id="regPassword" placeholder="Минимум 4 символа" autocomplete="new-password">
      <label class="field-label">Повтор пароля</label>
      <input type="password" id="regPassword2" placeholder="Повторите пароль" autocomplete="new-password">
      <button class="submit-btn" onclick="doRegister()">Зарегистрироваться</button>
    </div>
    <div class="device-badge" id="deviceBadge"></div>
  </div>
</div>

<div id="appScreen" style="display:none">
  <header>
    <h1>Админ-панель</h1>
    <div class="header-right">
      <div class="user-chip" id="userChip"></div>
      <button class="burger" id="burgerBtn">☰</button>
    </div>
    <div class="menu" id="burgerMenu">
      <button data-tab="surveys">Мои анкеты</button>
      <button data-tab="allSurveys">Все анкеты</button>
      <button data-tab="results">Результаты</button>
      <button data-tab="bots">Мои боты</button>
      <button data-tab="responses">Ответы</button>
      <div class="divider"></div>
      <button onclick="logout()" style="color:#dc2626">Выйти</button>
    </div>
  </header>

  <div class="container">
    <div id="tab-surveys">
      <div class="grid">
        <div class="card">
          <h2>Создать анкету</h2>
          <div class="row"><input type="text" id="surveyTitle" placeholder="Название анкеты"></div>
          <div id="questionsEditor"></div>
          <div class="row">
            <button onclick="addQuestion()">Добавить вопрос</button>
            <button onclick="saveSurvey()">Сохранить</button>
          </div>
        </div>
        <div class="card">
          <h2>Мои анкеты <span class="badge" id="surveyCount">0</span></h2>
          <div id="surveyList"></div>
        </div>
      </div>
    </div>

    <div id="tab-allSurveys" class="tab-hidden">
      <div class="card">
        <h2>Все анкеты в системе <span class="badge" id="allSurveyCount">0</span></h2>
        <p class="muted">Анкеты всех пользователей с любых устройств.</p>
        <div id="allSurveyList"></div>
      </div>
    </div>

    <div id="tab-bots" class="tab-hidden">
      <div class="grid">
        <div class="card">
          <h2>Создать бота</h2>
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
            <div class="profile-preview"><img id="botAvatarPreview" src="" alt="" style="display:none"></div>
            <label class="photo-btn" for="botAvatarInput">Фото профиля</label>
            <input type="file" id="botAvatarInput" accept="image/*" style="display:none" onchange="handleBotAvatar(event)">
          </div>
          <div class="row"><input type="text" id="botName" placeholder="Имя бота"><button onclick="createBot()">Создать</button></div>
          <div class="row"><button onclick="runAllBotsMine()">Запустить моих ботов по всем анкетам</button></div>
        </div>
        <div class="card">
          <h2>Мои боты <span class="badge" id="botCount">0</span></h2>
          <div id="botList"></div>
          <div class="bot-send-bar" id="botSendBar" style="display:none">
            <select id="botTargetSurvey"></select>
            <button onclick="sendSelectedBotsToSurvey()">Отправить выбранных</button>
            <button onclick="clearBotSelection()" style="background:rgba(255,255,255,0.2);color:#fff">Снять</button>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-responses" class="tab-hidden">
      <div class="card">
        <h2>Редактирование ответов</h2>
        <div class="row"><select id="editSurveySelect" onchange="renderResponsesEdit()"></select></div>
        <div id="responsesEditBox"></div>
      </div>
    </div>

    <div id="tab-results" class="tab-hidden">
      <div class="card">
        <h2>Результаты</h2>
        <div class="results-toolbar">
          <div class="field"><label>Анкета</label><select id="resultSurveySelect" onchange="renderResults()"></select></div>
          <div class="field"><label>Тип диаграммы</label><select id="chartType" onchange="renderResults()">
            <option value="bar">Столбчатая</option>
            <option value="horizontalBar">Горизонтальная</option>
            <option value="doughnut">Кольцевая</option>
            <option value="pie">Круговая</option>
            <option value="polarArea">Полярная</option>
            <option value="radar">Радар</option>
          </select></div>
        </div>
        <div id="resultSummary" class="results-summary-bar"></div>
        <div id="resultsContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SESSION_KEY = 'survey_admin_session_v6';
const DEFAULT_AVATAR = `data:image/svg+xml;utf8,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#cbd5e1"/>
  <circle cx="32" cy="24" r="12" fill="#94a3b8"/>
  <path d="M8 60c0-13 10-22 24-22s24 9 24 22z" fill="#94a3b8"/>
</svg>
`)}`;

const state = {
  currentUser: null,
  questionCounter: 0,
  charts: [],
  editingOptions: {},
  selectedBotIds: new Set()
};

let pendingBotAvatar = '';
let currentTab = 'surveys';

function uid() { return Math.random().toString(36).slice(2, 10); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getDeviceId() {
  let id = localStorage.getItem('survey_device_id');
  if (!id) { id = 'dev_' + Math.random().toString(36).slice(2, 12); localStorage.setItem('survey_device_id', id); }
  return id;
}

function getDeviceInfo() {
  const nav = navigator;
  const scr = window.screen || {};
  return {
    ua: nav.userAgent || '',
    appVersion: nav.appVersion || '',
    platform: nav.platform || '',
    vendor: nav.vendor || '',
    language: nav.language || '',
    languages: (nav.languages || []).join(', '),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    screen: `${scr.width || 0}x${scr.height || 0}`,
    availScreen: `${scr.availWidth || 0}x${scr.availHeight || 0}`,
    colorDepth: scr.colorDepth || 0,
    pixelRatio: window.devicePixelRatio || 1,
    cores: nav.hardwareConcurrency || 0,
    memory: nav.deviceMemory || 0,
    touch: ('ontouchstart' in window) ? 'да' : 'нет',
    online: nav.onLine ? 'да' : 'нет',
    cookies: nav.cookieEnabled ? 'да' : 'нет',
    doNotTrack: nav.doNotTrack || '—',
    referrer: document.referrer || 'прямой заход',
    url: location.href
  };
}

function getData() { return SurveyAPI.getState(); }
async function persist() { await SurveyAPI.saveState(SurveyAPI.getState()); }

function saveSession(userId) { try { localStorage.setItem(SESSION_KEY, JSON.stringify({ userId, device: getDeviceId() })); } catch (e) {} }
function loadSession() { try { const r = localStorage.getItem(SESSION_KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }

function switchAuth(mode) {
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('authError').classList.remove('show');
}
function showAuthError(msg) { const el = document.getElementById('authError'); el.textContent = msg; el.classList.add('show'); }

async function doRegister() {
  const name = document.getElementById('regName').value.trim();
  const pass = document.getElementById('regPassword').value;
  const pass2 = document.getElementById('regPassword2').value;
  if (!name || name.length < 2) return showAuthError('Имя минимум 2 символа');
  if (!pass || pass.length < 4) return showAuthError('Пароль минимум 4 символа');
  if (pass !== pass2) return showAuthError('Пароли не совпадают');
  const data = await SurveyAPI.fetchState();
  if (data.users.some(u => (u.name || '').toLowerCase() === name.toLowerCase())) return showAuthError('Имя занято');
  const user = {
    id: uid(), name, password: pass, avatar: '', deviceId: getDeviceId(), device: getDeviceInfo(),
    banned: false, createdAt: Date.now(), lastLoginAt: Date.now(), loginCount: 1
  };
  data.users.push(user);
  await SurveyAPI.saveState(data);
  saveSession(user.id);
  enterApp(user);
}

async function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!name || !pass) return showAuthError('Введите имя и пароль');
  const data = await SurveyAPI.fetchState();
  const user = data.users.find(u => (u.name || '').toLowerCase() === name.toLowerCase() && u.password === pass);
  if (!user) return showAuthError('Неверное имя или пароль');
  if (user.banned) return showAuthError('Вы заблокированы');
  user.lastLoginAt = Date.now();
  user.loginCount = (user.loginCount || 0) + 1;
  user.lastDevice = getDeviceInfo();
  await SurveyAPI.saveState(data);
  saveSession(user.id);
  enterApp(user);
}

function logout() {
  clearSession();
  state.currentUser = null;
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'flex';
  switchAuth('login');
}

function enterApp(user) {
  state.currentUser = user;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  renderUserChip();
  refreshAll();
}

function renderUserChip() {
  if (!state.currentUser) return;
  const u = state.currentUser;
  document.getElementById('userChip').innerHTML = `<div class="av"><img src="${u.avatar || DEFAULT_AVATAR}" alt=""></div><span>${escapeHtml(u.name)}</span>`;
}

function initAuth() {
  document.getElementById('deviceBadge').textContent = 'ID устройства: ' + getDeviceId();
  const sess = loadSession();
  if (sess && sess.userId) {
    const data = SurveyAPI.getState();
    const user = data.users.find(u => u.id === sess.userId);
    if (user && !user.banned) { enterApp(user); return; }
  }
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
}

function mySurveys() { return getData().surveys.filter(s => s.ownerId === state.currentUser.id); }
function myBots() { return getData().bots.filter(b => b.ownerId === state.currentUser.id); }

function updateStats() {
  document.getElementById('surveyCount').textContent = mySurveys().length;
  document.getElementById('botCount').textContent = myBots().length;
  document.getElementById('allSurveyCount').textContent = getData().surveys.length;
  updateSelectedBotsUI();
}

function addQuestion() {
  const id = 'q_' + (++state.questionCounter);
  state.editingOptions[id] = { text: '', type: 'closed', multi: false, options: ['', ''] };
  window.__qDraft = window.__qDraft || {};
  window.__qDraft[id] = state.editingOptions[id];
  renderQuestionsEditor();
}

function renderQuestionsEditor() {

        <button class="danger" data-role="delq">✕</button>
      </div>
      <div class="options"></div>
    `;
    const qtext = block.querySelector('[data-role="qtext"]');
    const qtype = block.querySelector('[data-role="qtype"]');

    const multiwrap = block.querySelector('[data-role="multiwrap"]');
    qtext.value = q.text;
    qtype.value = q.type;
    qmulti.checked = q.multi;
    qtext.oninput = () => { q.text = qtext.value; };
    qtype.onchange = () => { q.type = qtype.value; if (q.type !== 'closed') { q.multi = false; qmulti.checked = false; } renderQuestionsEditor(); };
    qmulti.onchange = () => { q.multi = qmulti.checked; };
    multiwrap.style.display = q.type === 'closed' ? '' : 'none';
    block.querySelector('[data-role="delq"]').onclick = () => { delete draft[qid]; renderQuestionsEditor(); };
    const optBox = block.querySelector('.options');

      q.options.forEach((o, oi) => {
        const orow = document.createElement('div');
        orow.className = 'option-row';
        orow.innerHTML = `<input type="text" placeholder="Вариант ${oi + 1}" value="${escapeHtml(o)}"><button class="secondary" data-role="delopt">✕</button>`;

      addBtn.className = 'secondary';
      addBtn.onclick = () => { q.options.push(''); renderQuestionsEditor(); };
      optBox.appendChild(addBtn);
    }
    box.appendChild(block);
  });
}

async function saveSurvey() {
  const title = document.getElementById('surveyTitle').value.trim();
  if (!title) { alert('Введите название'); return; }
  const draft = window.__qDraft || {};
  const ids = Object.keys(draft);
  if (!ids.length) { alert('Добавьте вопрос'); return; }
  const questions = [];
  for (const qid of ids) {
    const q = draft[qid];
    const text = (q.text || '').trim();
    if (!text) { alert('Заполните вопросы'); return; }
    let options = [];
    if (q.type !== 'open') {
      options = (q.options || []).map(o => o.trim()).filter(Boolean);
      if (options.length < 2) { alert('Минимум 2 варианта: ' + text); return; }
    }
    questions.push({ id: qid, text, type: q.type, multi: !!q.multi, options });
  }
  const data = await SurveyAPI.fetchState();
  const me = data.users.find(u => u.id === state.currentUser.id);
  if (!me || me.banned) { alert('Аккаунт заблокирован'); return; }
  data.surveys.push({ id: uid(), title, questions, ownerId: state.currentUser.id, ownerName: state.currentUser.name, createdAt: Date.now() });
  await SurveyAPI.saveState(data);
  window.__qDraft = {};
  document.getElementById('surveyTitle').value = '';
  renderQuestionsEditor();
  refreshAll();
  alert('Анкета сохранена и доступна на всех устройствах.');
}

function smartOpenAnswer(questionText) {
  const q = questionText.toLowerCase();
  const banks = {
    like: ['Нравится удобство и простота использования.','Нравится скорость работы и продуманность.','Ценю качество и внимание к деталям.','Импонирует гибкость настроек.','Радует понятный интерфейс.'],
    dislike: ['Не нравится, что приходится долго разбираться в мелочах.','Раздражает нестабильная работа.','Не хватает понятной инструкции.','Огорчает, что важные функции спрятаны глубоко.','Не устраивает отсутствие быстрой отмены.'],
    suggest: ['Предложил бы добавить подсказки для новичков.','Хотелось бы наглядную статистику.','Советую упростить навигацию.','Стоит добавить сохранение черновиков.','Рекомендую сделать заметнее кнопку сохранения.'],
    experience: ['Сталкивался с подобным раньше, опыт положительный.','Пользовался похожими системами, здесь аккуратнее.','Опыт есть, главное — стабильность.','Пробовал разные варианты, этот достойный.','Случалось работать с аналогами.'],
    generic: ['В целом впечатление положительное.','Отвечаю по существу: всё логично.','Есть что улучшить, но основа хорошая.','Ответ простой: мне всё понятно и удобно.','Впечатления нормальные, без сложностей.']
  };
  let pool = banks.generic;
  if (/нрав|любите|хорошо|плюс|преимуществ/.test(q) && !/не нрав|минус/.test(q)) pool = banks.like;
  else if (/не нрав|минус|недостат|проблем/.test(q)) pool = banks.dislike;
  else if (/предлож|идея|рекоменд|совет/.test(q)) pool = banks.suggest;
  else if (/опыт|сталкивались|пользовались/.test(q)) pool = banks.experience;
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateAnswers(survey) {
  const answers = {};
  survey.questions.forEach(q => {
    if (q.type === 'open') answers[q.id] = smartOpenAnswer(q.text);
    else if (q.type === 'semi') {
      const useOwn = Math.random() < 0.3;
      if (useOwn) answers[q.id] = smartOpenAnswer(q.text);
      else if (q.multi) { const count = 1 + Math.floor(Math.random() * Math.max(1, q.options.length - 1)); answers[q.id] = q.options.slice().sort(() => Math.random() - 0.5).slice(0, count); }
      else answers[q.id] = q.options[Math.floor(Math.random() * q.options.length)];
    } else {
      if (q.multi) { const count = 1 + Math.floor(Math.random() * Math.max(1, q.options.length - 1)); answers[q.id] = q.options.slice().sort(() => Math.random() - 0.5).slice(0, count); }
      else answers[q.id] = q.options[Math.floor(Math.random() * q.options.length)];
    }
  });
  return answers;
}

function collectAnswers(survey, container) {
  const answers = {};
  survey.questions.forEach(q => {
    if (q.type === 'open') { const el = container.querySelector(`input[data-qid="${q.id}"][data-type="open"]`); answers[q.id] = el ? el.value.trim() : ''; }
    else if (q.type === 'semi') {
      const own = container.querySelector(`input[data-qid="${q.id}"][data-type="semi-own"]`);
      const ownVal = own ? own.value.trim() : '';
      if (q.multi) { const els = container.querySelectorAll(`input[data-qid="${q.id}"][data-type="semi-multi"]:checked`); const arr = Array.from(els).map(e => e.value); if (ownVal) arr.push(ownVal); answers[q.id] = arr; }
      else { const el = container.querySelector(`input[data-qid="${q.id}"][data-type="semi-single"]:checked`); answers[q.id] = ownVal || (el ? el.value : ''); }
    } else {
      if (q.multi) { const els = container.querySelectorAll(`input[data-qid="${q.id}"][data-type="closed-multi"]:checked`); answers[q.id] = Array.from(els).map(e => e.value); }
      else { const el = container.querySelector(`input[data-qid="${q.id}"][data-type="closed-single"]:checked`); answers[q.id] = el ? el.value : ''; }
    }
  });
  return answers;
}

function smartColors(labels, values) {
  const palettes = [['#6366f1','#818cf8','#a5b4fc','#c7d2fe','#e0e7ff'],['#8b5cf6','#a78bfa','#c4b5fd','#ddd6fe','#ede9fe'],['#ec4899','#f472b6','#f9a8d4','#fbcfe8','#fce7f3'],['#10b981','#34d399','#6ee7b7','#a7f3d0','#d1fae5'],['#f59e0b','#fbbf24','#fcd34d','#fde68a','#fef3c7']];
  const max = Math.max(...values, 1);
  return labels.map((_, i) => {
    const intensity = Math.max(0.35, Math.min(1, (values[i] || 0) / max));
    const palette = palettes[i % palettes.length];
    return palette[Math.min(palette.length - 1, Math.floor((1 - intensity) * (palette.length - 1)))];
  });
}

    responses.forEach(r => { const a = r.answers[q.id]; if (Array.isArray(a)) a.forEach(v => counts[v] = (counts[v] || 0) + 1); else if (a) counts[a] = (counts[a] || 0) + 1; });
    let labels, values;
    if (q.type === 'open' || q.type === 'semi') { const arr = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8); labels = arr.map(x => truncate(x[0], 24)); values = arr.map(x => x[1]); }
    else { labels = q.options.map(o => truncate(o, 24)); values = q.options.map(l => counts[l] || 0); }
    const canvas = block.querySelector('canvas');
    if (!labels.length || values.every(v => v === 0)) {
      block.querySelector('.chart-canvas-wrap').innerHTML = '<div class="muted" style="text-align:center;padding:30px">Нет данных</div>';
    } else {
      const ctx = canvas.getContext('2d');
      const chart = new Chart(ctx, {
        type: chartType === 'horizontalBar' ? 'bar' : chartType,
        data: { labels, datasets: [{ label: 'Количество', data: values, backgroundColor: smartColors(labels, values), borderColor: isCircular ? '#fff' : 'transparent', borderWidth: isCircular ? 3 : 0, borderRadius: isCircular ? 0 : 6, maxBarThickness: 44 }] },
        options: { responsive: true, maintainAspectRatio: false, indexAxis: chartType === 'horizontalBar' ? 'y' : 'x', plugins: { legend: { display: isCircular, position: 'bottom', labels: { font: { size: 11 } } } }, scales: isCircular ? {} : { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } } }
      });
      state.charts.push(chart);
    }
    const ansList = block.querySelector('.answers-list');
    responses.slice().reverse().forEach(r => {
      const row = document.createElement('div');
      row.className = 'answer-row';
      row.innerHTML = `<div class="avatar"><img src="${r.avatar || DEFAULT_AVATAR}" alt=""></div><div class="answer-content"><div class="q">${escapeHtml(r.botName)}</div><div class="a">${escapeHtml(formatAnswer(r.answers[q.id]))}</div></div>`;
      ansList.appendChild(row);
    });
  });
}

function switchTab(tab) {
  currentTab = tab;
  ['surveys', 'allSurveys', 'bots', 'responses', 'results'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    if (!el) return;
    el.style.display = t === tab ? '' : 'none';
    el.classList.toggle('tab-hidden', t !== tab);
  });
  if (tab === 'results') renderResults();
  if (tab === 'responses') renderResponsesEdit();
  if (tab === 'bots') { renderBotList(); updateSelectedBotsUI(); }
  if (tab === 'allSurveys') renderAllSurveys();
}

function refreshAll() {
  if (!state.currentUser) return;
  const data = getData();
  const fresh = data.users.find(u => u.id === state.currentUser.id);
  if (fresh) {
    state.currentUser = fresh;
    if (fresh.banned) { alert('Аккаунт заблокирован'); logout(); return; }
  }
  renderUserChip();
  renderSurveyList();
  renderAllSurveys();
  renderBotList();
  refreshSelects();
  updateStats();
}

document.getElementById('burgerBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('burgerMenu').classList.toggle('open'); };
document.addEventListener('click', (e) => {
  const menu = document.getElementById('burgerMenu');
  const btn = document.getElementById('burgerBtn');
  if (menu && !menu.contains(e.target) && e.target !== btn) menu.classList.remove('open');
});
document.querySelectorAll('.menu button').forEach(b => {
  b.onclick = () => { if (b.dataset.tab) switchTab(b.dataset.tab); document.getElementById('burgerMenu').classList.remove('open'); };
});

SurveyAPI.onChange((data, reason) => {
  if (reason === 'fetch' && state.currentUser) {
    const me = data.users.find(u => u.id === state.currentUser.id);
    if (me && me.banned) { alert('Аккаунт заблокирован'); logout(); return; }
    refreshAll();
  }
});

SurveyAPI.init().then(() => {
  initAuth();
  setInterval(() => { if (state.currentUser) refreshAll(); }, 2000);
});
</script>
