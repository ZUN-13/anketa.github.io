<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анкетирование</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      color: #1f2937;
      min-height: 100vh;
      font-size: 16px;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      padding: 16px 20px;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: 0.9;
    }

    .live-dot span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(74, 222, 128, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
      }
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
      margin-bottom: 16px;
      border: 1px solid #eef2f7;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    input,
    select,
    button,
    textarea {
      font-family: inherit;
      font-size: 15px;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      outline: none;
      background: #fff;
      width: 100%;
      margin-bottom: 10px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    button {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: auto;
      padding: 11px 18px;
    }

    button:active {
      transform: scale(0.98);
    }

    .question-block {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #f8fafc;
    }

    .question-block label {
      display: block;
      margin: 7px 0;
      font-size: 15px;
      cursor: pointer;
    }

    .question-block input[type="radio"],
    .question-block input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
      vertical-align: middle;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .profile-preview {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #cbd5e1;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e2e8f0;
    }

    .profile-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-btn {
      background: #eef2ff;
      color: #4338ca;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #c7d2fe;
    }

    .photo-btn:hover {
      background: #e0e7ff;
    }

    .survey-meta {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .survey-meta .owner {
      font-weight: 600;
      color: #4338ca;
    }

    .banner {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .banner.show {
      display: block;
    }

    .empty-box {
      text-align: center;
      padding: 24px 8px;
    }

    .empty-box .icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .empty-box p {
      margin: 4px 0;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 14px;
        border-radius: 12px;
      }

      header h1 {
        font-size: 16px;
      }

      input,
      select,
      button {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>📋 Анкетирование</h1>
    <div class="live-dot"><span></span>онлайн</div>
  </header>
  <div class="container">
    <div id="updateBanner" class="banner">Анкета обновлена. Загружена актуальная версия.</div>
    <div class="card">
      <div id="surveyPickRow" style="display:none">
        <select id="surveyPick"></select>
      </div>
      <div id="publicForm"></div>
    </div>
  </div>

  <script>
    const DATA_KEY = 'survey_app_v6';
    const CHANNEL_NAME = 'survey_updates_v6';
    const DEFAULT_AVATAR = `data:image/svg+xml;utf8,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#cbd5e1"/>
  <circle cx="32" cy="24" r="12" fill="#94a3b8"/>
  <path d="M8 60c0-13 10-22 24-22s24 9 24 22z" fill="#94a3b8"/>
</svg>
`)}`;

    let pendingAvatar = '';
    let currentSurveyId = '';
    let lastSignature = '';
    let channel = null;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function uid() { return Math.random().toString(36).slice(2, 10); }

    function loadData() {
      try {
        const raw = localStorage.getItem(DATA_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { }
      return { users: [], surveys: [], bots: [], responses: [] };
    }
    function saveData(d) {
      try { localStorage.setItem(DATA_KEY, JSON.stringify(d)); } catch (e) { }
    }

    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { alert('Файл слишком большой (макс. 2 МБ)'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => {
        pendingAvatar = ev.target.result;
        const img = document.getElementById('profileImg');
        if (img) img.src = pendingAvatar;
      };
      reader.readAsDataURL(file);
    }

    function getInitialSurveyId(surveys) {
      const urlId = getParam('survey');
      if (urlId && surveys.some(s => s.id === urlId)) return urlId;
      return surveys[0].id;
    }

    function signatureOf(surveys, users) {
      return JSON.stringify({
        s: surveys.map(s => ({
          id: s.id,
          title: s.title,
          ownerId: s.ownerId,
          questions: s.questions.map(q => ({ id: q.id, text: q.text, type: q.type, multi: q.multi, options: q.options }))
        })),
        u: users.map(u => ({ id: u.id, name: u.name, banned: !!u.banned }))
      });
    }

    function isFormDirty(survey) {
      if (!survey) return false;
      let dirty = false;
      survey.questions.forEach(q => {
        if (q.type === 'open') {
          const el = document.querySelector(`input[data-qid="${q.id}"][data-type="open"]`);
          if (el && el.value.trim()) dirty = true;
        } else if (q.type === 'semi') {
          const own = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-own"]`);
          if (own && own.value.trim()) dirty = true;
          const cM = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-multi"]:checked`);
          const cS = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-single"]:checked`);
          if (cM || cS) dirty = true;
        } else {
          const cM = document.querySelector(`input[data-qid="${q.id}"][data-type="closed-multi"]:checked`);
          const cS = document.querySelector(`input[data-qid="${q.id}"][data-type="closed-single"]:checked`);
          if (cM || cS) dirty = true;
        }
      });
      const nameEl = document.getElementById('respName');
      if (nameEl && nameEl.value.trim()) dirty = true;
      return dirty;
    }

    function showBanner(text) {
      const b = document.getElementById('updateBanner');
      b.textContent = text;
      b.classList.add('show');
      setTimeout(() => b.classList.remove('show'), 5000);
    }

    function renderEmpty() {
      const box = document.getElementById('publicForm');
      document.getElementById('surveyPickRow').style.display = 'none';
      box.innerHTML = `
    <div class="empty-box">
      <div class="icon">🗂️</div>
      <p><strong>Пока нет доступных анкет</strong></p>
      <p class="muted">Создайте анкету в админ-панели — она появится здесь автоматически.</p>
    </div>`;
    }

    function renderPublic(force = false) {
      const data = loadData();
      const box = document.getElementById('publicForm');
      const pickRow = document.getElementById('surveyPickRow');
      const pick = document.getElementById('surveyPick');

      const bannedIds = new Set(data.users.filter(u => u.banned).map(u => u.id));
      const visibleSurveys = data.surveys.filter(s => !bannedIds.has(s.ownerId));

      if (!visibleSurveys.length) {
        renderEmpty();
        lastSignature = '';
        return;
      }

      if (!currentSurveyId || !visibleSurveys.some(s => s.id === currentSurveyId)) {
        currentSurveyId = getInitialSurveyId(visibleSurveys);
      }

      const newSig = signatureOf(visibleSurveys, data.users);
      if (!force && newSig === lastSignature && box.children.length) return;
      lastSignature = newSig;

      if (visibleSurveys.length > 1) {
        pickRow.style.display = 'block';
        pick.innerHTML = visibleSurveys.map(s => {
          const owner = data.users.find(u => u.id === s.ownerId);
          const ownerName = owner ? owner.name : (s.ownerName || '');
          return `<option value="${s.id}" ${s.id === currentSurveyId ? 'selected' : ''}>${escapeHtml(s.title)}${ownerName ? ' — ' + escapeHtml(ownerName) : ''}</option>`;
        }).join('');
        pick.onchange = () => {
          currentSurveyId = pick.value;
          renderPublic(true);
        };
      } else {
        pickRow.style.display = 'none';
      }

      const survey = visibleSurveys.find(s => s.id === currentSurveyId);
      if (!survey) { renderEmpty(); return; }

      const dirty = isFormDirty(survey);
      if (dirty && !force) {
        showBanner('Анкета была изменена. Обновите страницу, чтобы увидеть новую версию.');
        return;
      }

      const owner = data.users.find(u => u.id === survey.ownerId);
      const ownerName = owner ? owner.name : (survey.ownerName || 'Неизвестный автор');

      box.innerHTML = `<h2>${escapeHtml(survey.title)}</h2>
    <div class="survey-meta">
      <span>Автор: <span class="owner">${escapeHtml(ownerName)}</span></span>
      <span>Вопросов: ${survey.questions.length}</span>
      <span>Ответов: ${data.responses.filter(r => r.surveyId === survey.id).length}</span>
    </div>
    <p class="muted">Заполните все вопросы и отправьте ответы.</p>
    <div class="profile-row">
      <div class="profile-preview"><img id="profileImg" src="${pendingAvatar || DEFAULT_AVATAR}" alt=""></div>
      <label class="photo-btn" for="avatarInput">Загрузить фото</label>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
      <input type="text" id="respName" placeholder="Ваше имя" style="flex:1;min-width:140px;margin-bottom:0">
    </div>
    <div id="publicQuestions"></div>
    <button id="publicSubmit">Отправить</button>
    <div id="publicMsg"></div>`;

      const qBox = document.getElementById('publicQuestions');
      survey.questions.forEach((q, idx) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        let inner = `<div><strong>${idx + 1}. ${escapeHtml(q.text)}</strong></div>`;
        if (q.type === 'open') {
          inner += `<input type="text" data-qid="${q.id}" data-type="open" placeholder="Ваш ответ">`;
        } else if (q.type === 'semi') {
          if (q.multi) {
            q.options.forEach(o => {
              inner += `<label><input type="checkbox" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="semi-multi"> ${escapeHtml(o)}</label>`;
            });
          } else {
            q.options.forEach(o => {
              inner += `<label><input type="radio" name="q_${q.id}" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="semi-single"> ${escapeHtml(o)}</label>`;
            });
          }
          inner += `<input type="text" data-qid="${q.id}" data-type="semi-own" placeholder="Свой вариант">`;
        } else {
          if (q.multi) {
            q.options.forEach(o => {
              inner += `<label><input type="checkbox" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="closed-multi"> ${escapeHtml(o)}</label>`;
            });
          } else {
            q.options.forEach(o => {
              inner += `<label><input type="radio" name="q_${q.id}" value="${escapeHtml(o)}" data-qid="${q.id}" data-type="closed-single"> ${escapeHtml(o)}</label>`;
            });
          }
        }
        block.innerHTML = inner;
        qBox.appendChild(block);
      });

      document.getElementById('publicSubmit').onclick = () => submitPublic(survey);
    }

    function submitPublic(survey) {
      const data = loadData();
      const liveSurvey = data.surveys.find(s => s.id === survey.id);
      if (!liveSurvey) { alert('Анкета была удалена.'); currentSurveyId = ''; renderPublic(true); return; }
      const owner = data.users.find(u => u.id === liveSurvey.ownerId);
      if (owner && owner.banned) {
        alert('Автор анкеты заблокирован. Анкета недоступна для прохождения.');
        renderPublic(true);
        return;
      }
      if (JSON.stringify(liveSurvey.questions) !== JSON.stringify(survey.questions)) {
        alert('Анкета была изменена. Загружена актуальная версия — заполните заново.');
        renderPublic(true);
        return;
      }
      const nameEl = document.getElementById('respName');
      const name = (nameEl.value || '').trim() || 'Аноним';
      const answers = {};
      let ok = true;
      survey.questions.forEach(q => {
        if (q.type === 'open') {
          const el = document.querySelector(`input[data-qid="${q.id}"][data-type="open"]`);
          const v = el ? el.value.trim() : '';
          if (!v) ok = false;
          answers[q.id] = v;
        } else if (q.type === 'semi') {
          const own = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-own"]`);
          const ownVal = own ? own.value.trim() : '';
          if (q.multi) {
            const els = document.querySelectorAll(`input[data-qid="${q.id}"][data-type="semi-multi"]:checked`);
            const arr = Array.from(els).map(e => e.value);
            if (ownVal) arr.push(ownVal);
            if (!arr.length) ok = false;
            answers[q.id] = arr;
          } else {
            const el = document.querySelector(`input[data-qid="${q.id}"][data-type="semi-single"]:checked`);
            answers[q.id] = ownVal || (el ? el.value : '');
            if (!answers[q.id]) ok = false;
          }
        } else {
          if (q.multi) {
            const els = document.querySelectorAll(`input[data-qid="${q.id}"][data-type="closed-multi"]:checked`);
            const arr = Array.from(els).map(e => e.value);
            if (!arr.length) ok = false;
            answers[q.id] = arr;
          } else {
            const el = document.querySelector(`input[data-qid="${q.id}"][data-type="closed-single"]:checked`);
            if (!el) ok = false;
            answers[q.id] = el ? el.value : '';
          }
        }
      });
      const msg = document.getElementById('publicMsg');
      if (!ok) { msg.innerHTML = '<p style="color:#dc2626;margin-top:10px">Ответьте на все вопросы.</p>'; return; }
      data.responses.push({
        id: uid(),
        surveyId: survey.id,
        botId: 'public_' + uid(),
        botName: name,
        avatar: pendingAvatar || '',
        source: 'public',
        answers,
        createdAt: Date.now()
      });
      saveData(data);
      if (channel) { try { channel.postMessage({ type: 'update', at: Date.now() }); } catch (e) { } }
      document.getElementById('publicQuestions').innerHTML = '';
      document.getElementById('publicSubmit').style.display = 'none';
      msg.innerHTML = '<div class="success" style="margin-top:12px">✅ Спасибо! Ваши ответы сохранены.</div>';
    }

    function syncFromStorage() {
      const data = loadData();
      const bannedIds = new Set(data.users.filter(u => u.banned).map(u => u.id));
      const visible = data.surveys.filter(s => !bannedIds.has(s.ownerId));
      const newSig = signatureOf(visible, data.users);
      if (newSig !== lastSignature) {
        const had = !!lastSignature;
        renderPublic();
        if (had && newSig) showBanner('Анкета обновлена. Загружена актуальная версия.');
      }
    }

    window.addEventListener('storage', (e) => { if (e.key === DATA_KEY) syncFromStorage(); });
    try {
      channel = new BroadcastChannel(CHANNEL_NAME);
      channel.onmessage = (e) => { if (e.data && e.data.type === 'update') syncFromStorage(); };
    } catch (e) { channel = null; }
    setInterval(syncFromStorage, 1000);
    window.addEventListener('focus', syncFromStorage);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFromStorage(); });

    renderPublic(true);
  </script>
</body>

</html>
